[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aros-research"
version = "0.1.0"
description = "AROS research-intelligence worker (unprivileged, restartable)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "AROS Contributors" }]
dependencies = [
    "pydantic>=2.13.0,<3",
    "httpx>=0.28.0,<1",
    "protobuf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
aros-research-worker = "aros_research.worker:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["aros_research"]

[tool.pytest.ini_options]
testpaths = ["python"]
