name: mvp-hardening-bot

on:
  push:
    branches: [hardening/mvp-evidence-containment-rename-seam]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[mvp-hardening-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/mvp-evidence-containment-rename-seam
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Integrate verifier-owned replay and rename seam
        shell: python
        run: |
          from pathlib import Path

          engine = Path('crates/aros-core/src/engine.rs')
          text = engine.read_text()
          start = text.index('        let replay = match kind {')
          end = text.index('        let verifier = VerifierRun {', start)
          replacement = r'''        // E3 exists from the attacker's observation. E4 is only created after
          // a dedicated verifier independently snapshots and replays the exact target.
          let oracle = match kind {
              FixtureKind::Authz => "body contains bob-secret",
              FixtureKind::Path => "body contains fixture-path-secret",
              FixtureKind::Deceptive => "n/a",
          };
          let invariant = hypothesis.security_invariant.clone();
          let mut bundle = EvidenceBundle {
              finding_id,
              campaign_id: campaign.id,
              manifest_hash: campaign.manifest_hash.clone(),
              snapshot_id: original.id,
              sandbox_id: Some(sandbox.id.to_string()),
              claim: finding.claim.clone(),
              artifact_digests: vec![art.digest_blake3.clone()],
              level: EvidenceLevel::E3InvariantViolation,
          };
          let mut vinput = crate::verifier::reduced_input(
              &finding,
              &bundle,
              VerifierMode::ReproduceCandidate,
              oracle,
              &invariant,
          );
          vinput.replay = Some(match kind {
              FixtureKind::Authz => crate::verifier::VerifierReplay {
                  target_root: fixture_root.to_string_lossy().into_owned(),
                  expected_tree_digest: original.source_tree_digest.clone(),
                  kind: crate::verifier::FixtureReplayKind::Authz,
                  request_path: "/users/2".into(),
                  cookie: Some("user=1".into()),
                  oracle_substring: "bob-secret".into(),
              },
              FixtureKind::Path => crate::verifier::VerifierReplay {
                  target_root: fixture_root.to_string_lossy().into_owned(),
                  expected_tree_digest: original.source_tree_digest.clone(),
                  kind: crate::verifier::FixtureReplayKind::Path,
                  request_path: "/files?path=../secret.txt".into(),
                  cookie: None,
                  oracle_substring: "fixture-path-secret".into(),
              },
              FixtureKind::Deceptive => unreachable!(),
          });
          if vinput.attacker_hidden_reasoning {
              return Err(EngineError::FailClosed(
                  "independent verifier must never receive attacker notes".into(),
              ));
          }
          let independent = match crate::verifier::verify_in_subprocess(&vinput) {
              Ok(result) => result,
              Err(error) => {
                  finding.evidence_level = EvidenceLevel::E3InvariantViolation;
                  finding.verified = false;
                  campaign.state = CampaignState::InsufficientEvidence;
                  store.put_campaign(&campaign)?;
                  return Err(EngineError::FailClosed(format!(
                      "independent verification unavailable; evidence capped at E3: {error}"
                  )));
              }
          };
          let verifier_isolated = true;
          if !independent.accepted || !independent.oracle_observed {
              campaign.state = CampaignState::NonReproducible;
              store.put_campaign(&campaign)?;
              return Err(EngineError::FailClosed(format!(
                  "independent verifier rejected: {}",
                  independent.reason
              )));
          }
          if independent.target_digest_observed.as_deref()
              != Some(original.source_tree_digest.as_str())
          {
              campaign.state = CampaignState::InsufficientEvidence;
              store.put_campaign(&campaign)?;
              return Err(EngineError::FailClosed(
                  "independent verifier did not reproduce the exact target digest".into(),
              ));
          }
          bundle.level = EvidenceLevel::E4IndependentReproduction;

'''
          engine.write_text(text[:start] + replacement + text[end:])

          lib = Path('crates/aros-core/src/lib.rs')
          text = lib.read_text()
          old = '''pub use verifier::{\n    adjudicate_from_input, reduced_input, verifier_bin_present, verify_in_subprocess,\n    VerifierInput, VerifierProcessResult,\n};'''
          new = '''pub use verifier::{\n    adjudicate_from_input, reduced_input, reproduce_and_adjudicate, verifier_bin_present,\n    verify_in_subprocess, FixtureReplayKind, VerifierInput, VerifierProcessResult, VerifierReplay,\n};'''
          if old not in text:
              raise SystemExit('expected verifier export block not found')
          lib.write_text(text.replace(old, new))

          test = Path('crates/aros-core/tests/verifier_subprocess.rs')
          test.write_text(r'''//! Integration test: E4 verifier is a separate OS process that owns replay.

#![allow(clippy::unwrap_used, clippy::expect_used)]

use aros_core::{
    snapshot::snapshot_tree, verify_in_subprocess, FixtureReplayKind, VerifierInput, VerifierReplay,
};
use aros_types::TargetId;

#[test]
fn verifier_process_replays_exact_target_and_observes_oracle() {
    let fixture = tempfile::tempdir().unwrap();
    std::fs::write(fixture.path().join("server.py"), "VULN_IDOR = True\n").unwrap();
    let snapshot = snapshot_tree(TargetId::new(), fixture.path()).unwrap();
    let input = VerifierInput {
        claim: "idor".into(),
        snapshot_id: snapshot.id.to_string(),
        candidate_reproduction: None,
        oracle_contract: "body contains bob-secret".into(),
        invariant: "tenant isolation".into(),
        replay: Some(VerifierReplay {
            target_root: fixture.path().to_string_lossy().into_owned(),
            expected_tree_digest: snapshot.source_tree_digest.clone(),
            kind: FixtureReplayKind::Authz,
            request_path: "/users/2".into(),
            cookie: Some("user=1".into()),
            oracle_substring: "bob-secret".into(),
        }),
        attacker_hidden_reasoning: false,
    };

    let result = verify_in_subprocess(&input).unwrap();
    assert!(result.accepted, "{}", result.reason);
    assert!(result.oracle_observed);
    assert_eq!(
        result.target_digest_observed.as_deref(),
        Some(snapshot.source_tree_digest.as_str())
    );
}

#[test]
fn exact_target_mutation_is_rejected() {
    let fixture = tempfile::tempdir().unwrap();
    std::fs::write(fixture.path().join("server.py"), "VULN_PATH = True\n").unwrap();
    let snapshot = snapshot_tree(TargetId::new(), fixture.path()).unwrap();
    std::fs::write(fixture.path().join("server.py"), "VULN_PATH = False\n").unwrap();
    let input = VerifierInput {
        claim: "path traversal".into(),
        snapshot_id: snapshot.id.to_string(),
        candidate_reproduction: None,
        oracle_contract: "body contains fixture-path-secret".into(),
        invariant: "data root confinement".into(),
        replay: Some(VerifierReplay {
            target_root: fixture.path().to_string_lossy().into_owned(),
            expected_tree_digest: snapshot.source_tree_digest,
            kind: FixtureReplayKind::Path,
            request_path: "/files?path=../secret.txt".into(),
            cookie: None,
            oracle_substring: "fixture-path-secret".into(),
        }),
        attacker_hidden_reasoning: false,
    };
    let result = verify_in_subprocess(&input).unwrap();
    assert!(!result.accepted);
    assert!(result.reason.contains("digest mismatch"));
}
''')

          branding_doc = Path('docs/architecture/product-identity.md')
          branding_doc.write_text('''# Product identity / rename seam\n\n`AROS` is the current product identity, not a persistence or protocol invariant.\n\nCentral runtime identity constants live in `aros-types/src/branding.rs`. New user-visible product names, workspace names, database filenames, daemon/verifier/worker names, environment prefixes and protocol namespaces must be introduced through that layer.\n\nCrate/package names remain stable for v0.1 to avoid breaking Rust/Python imports. A future rename should use aliases/migrations rather than rewriting stored evidence. Persisted evidence should rely on schema versions, UUIDs, hashes and protocol versions, never the display product name.\n''')

      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/mvp-hardening-bot.yml

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace
          python -m pip install pydantic httpx protobuf pytest ruff mypy
          python -m ruff check python
          python -m mypy python/aros_research
          PYTHONPATH=python python -m pytest python -q

      - name: Commit integrated hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[mvp-hardening-bot] Integrate verifier-owned replay and rename seam'
          git push origin HEAD:hardening/mvp-evidence-containment-rename-seam
