name: apply-worker-provenance

on:
  push:
    branches: [hardening/epistemic-honesty-runtime-boundary]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[worker-provenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/epistemic-honesty-runtime-boundary
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: python
        run: |
          from pathlib import Path
          p = Path('crates/aros-api/src/main.rs')
          s = p.read_text()
          s = s.replace(
              'use aros_api::registry::{CampaignRecord, CampaignRegistry};',
              'use aros_api::registry::{CampaignRecord, CampaignRegistry, WorkerResearchTurn};'
          )
          s = s.replace(
              'use aros_types::{env_name, ToolIntent, DAEMON_NAME, PRODUCT_NAME};',
              'use aros_types::{env_name, CampaignId, ToolIntent, DAEMON_NAME, PRODUCT_NAME};'
          )
          s = s.replace(
              '    registry: Mutex<CampaignRegistry>,\n    daemon_token: String,',
              '    registry: Mutex<CampaignRegistry>,\n    worker_session_id: String,\n    daemon_token: String,'
          )
          marker = '''                if result.decision == "ALLOW" && result.stdout_digest.is_some() {\n                    *state.intents_executed.lock().await += 1;\n                }'''
          insert = '''                let research_turn = CampaignRegistry::new_worker_turn(\n                    &state.worker_session_id,\n                    &request_id,\n                    &message.capability,\n                    message.path.clone(),\n                    message.host.clone(),\n                    message.port,\n                    result.decision.clone(),\n                    result.reason.clone(),\n                    result.exit_status,\n                    result.stdout_digest.clone(),\n                );\n                if let Err(error) = state.registry.lock().await.put_worker_turn(&research_turn) {\n                    tracing::warn!(error = %error, "failed to persist worker research turn");\n                }\n                if result.decision == "ALLOW" && result.stdout_digest.is_some() {\n                    *state.intents_executed.lock().await += 1;\n                }'''
          if marker not in s:
              raise SystemExit('worker result marker not found')
          s = s.replace(marker, insert, 1)
          list_marker = '''async fn spawn_research_worker(state: &Arc<AppState>, listener: &WorkerListener, pythonpath: &str) {'''
          endpoint = '''async fn list_worker_turns(\n    State(state): State<Arc<AppState>>,\n    headers: HeaderMap,\n) -> Result<Json<Vec<WorkerResearchTurn>>, (StatusCode, Json<ApiError>)> {\n    if !authorized(&headers, &state) {\n        return Err(unauthorized());\n    }\n    let registry = state.registry.lock().await;\n    registry\n        .list_worker_turns()\n        .map(Json)\n        .map_err(|error| (StatusCode::INTERNAL_SERVER_ERROR, Json(ApiError { error })))\n}\n\n'''
          if list_marker not in s:
              raise SystemExit('spawn marker not found')
          s = s.replace(list_marker, endpoint + list_marker, 1)
          s = s.replace(
              '        registry: Mutex::new(registry),\n        daemon_token,',
              '        registry: Mutex::new(registry),\n        worker_session_id: CampaignId::new().to_string(),\n        daemon_token,'
          )
          s = s.replace(
              '        .route("/v1/campaigns/{id}", get(get_campaign))',
              '        .route("/v1/campaigns/{id}", get(get_campaign))\n        .route("/v1/research/turns", get(list_worker_turns))'
          )
          p.write_text(s)
      - run: cargo fmt --all
      - run: rm .github/workflows/apply-worker-provenance.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[worker-provenance] persist typed Python-to-Rust research turns'
          git push origin HEAD:hardening/epistemic-honesty-runtime-boundary
