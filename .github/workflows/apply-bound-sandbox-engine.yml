name: apply-bound-sandbox-engine

on:
  push:
    branches: [hardening/epistemic-honesty-runtime-boundary]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bound-sandbox-engine]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/epistemic-honesty-runtime-boundary
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: python
        run: |
          from pathlib import Path
          p = Path('crates/aros-core/src/engine.rs')
          s = p.read_text()
          old = '''pub struct CampaignEngine {\n    pub waive_containment: bool,\n}\n\nimpl CampaignEngine {\n    pub fn new(waive_containment: bool) -> Self {\n        Self { waive_containment }\n    }'''
          new = '''pub struct CampaignEngine {\n    pub waive_containment: bool,\n    bound_sandbox: Option<SandboxIdentity>,\n}\n\nimpl CampaignEngine {\n    pub fn new(waive_containment: bool) -> Self {\n        Self {\n            waive_containment,\n            bound_sandbox: None,\n        }\n    }\n\n    /// Construct an engine whose target is already executing in the concrete\n    /// sandbox represented by `sandbox`. Only this constructor may satisfy a\n    /// containment-required manifest.\n    pub fn with_bound_sandbox(sandbox: SandboxIdentity) -> Self {\n        Self {\n            waive_containment: false,\n            bound_sandbox: Some(sandbox),\n        }\n    }'''
          if old not in s:
              raise SystemExit('CampaignEngine constructor marker not found')
          s = s.replace(old, new, 1)
          old2 = '''        let report = aros_sandbox::RootlessOciSandboxProvider::detect().probe_containment_fresh();\n        let diagnostic = if report.live_oci_claimable() {\n            "OCI isolation is available but is not bound to this host-side campaign execution"\n        } else {\n            "OCI containment is not demonstrated on this host"\n        };\n        Err(EngineError::FailClosed(format!(\n            "{diagnostic}; refusing to mint a synthetic sandbox identity"\n        )))'''
          new2 = '''        if let Some(sandbox) = &self.bound_sandbox {\n            if sandbox.containment_demonstrated {\n                return Ok(sandbox.clone());\n            }\n            return Err(EngineError::FailClosed(\n                "bound sandbox exists but containment was not demonstrated".into(),\n            ));\n        }\n        let report = aros_sandbox::RootlessOciSandboxProvider::detect().probe_containment_fresh();\n        let diagnostic = if report.live_oci_claimable() {\n            "OCI isolation capability is available, but no concrete campaign target sandbox was bound"\n        } else {\n            "OCI containment is not demonstrated on this host"\n        };\n        Err(EngineError::FailClosed(format!(\n            "{diagnostic}; refusing to mint a synthetic sandbox identity"\n        )))'''
          if old2 not in s:
              raise SystemExit('containment assertion marker not found')
          p.write_text(s.replace(old2, new2, 1))
      - run: cargo fmt --all
      - run: rm .github/workflows/apply-bound-sandbox-engine.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[bound-sandbox-engine] bind evidence identity to concrete campaign runtime'
          git push origin HEAD:hardening/epistemic-honesty-runtime-boundary
