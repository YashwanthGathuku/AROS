name: apply-auth-helper

on:
  push:
    branches: [hardening/epistemic-honesty-runtime-boundary]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auth-helper]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/epistemic-honesty-runtime-boundary
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: python
        run: |
          from pathlib import Path
          p = Path('crates/aros-api/src/main.rs')
          s = p.read_text()
          s = s.replace(
              '    http::{header::AUTHORIZATION, HeaderMap, StatusCode},',
              '    http::{HeaderMap, StatusCode},'
          )
          s = s.replace(
              'use aros_api::campaign::{run_fixture_campaign, FixtureCampaignRequest, FixtureCampaignResponse};',
              'use aros_api::auth::bearer_authorized;\nuse aros_api::campaign::{run_fixture_campaign, FixtureCampaignRequest, FixtureCampaignResponse};'
          )
          old = '''fn authorized(headers: &HeaderMap, state: &AppState) -> bool {\n    headers\n        .get(AUTHORIZATION)\n        .and_then(|value| value.to_str().ok())\n        .and_then(|value| value.strip_prefix("Bearer "))\n        .is_some_and(|token| token == state.daemon_token)\n}'''
          new = '''fn authorized(headers: &HeaderMap, state: &AppState) -> bool {\n    bearer_authorized(headers, &state.daemon_token)\n}'''
          if old not in s:
              raise SystemExit('auth block not found')
          p.write_text(s.replace(old, new))
      - run: cargo fmt --all
      - run: rm .github/workflows/apply-auth-helper.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[auth-helper] use tested bearer auth helper'
          git push origin HEAD:hardening/epistemic-honesty-runtime-boundary
