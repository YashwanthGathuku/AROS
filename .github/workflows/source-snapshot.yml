name: source-snapshot

on:
  push:
    branches: [hardening/epistemic-honesty-runtime-boundary]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source
        run: git ls-files -z | tar --null -czf source-snapshot.tgz --files-from -
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.tgz
