name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pydantic httpx protobuf pytest ruff mypy
      - run: python scripts/check_branding_literals.py
      - run: python -m ruff check python scripts/check_branding_literals.py
      - run: python -m mypy python/aros_research
      - run: PYTHONPATH=python python -m pytest python -q
