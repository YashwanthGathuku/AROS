name: apply-rustfmt

on:
  push:
    branches: [hardening/epistemic-honesty-runtime-boundary]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[apply-rustfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/epistemic-honesty-runtime-boundary
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: rm .github/workflows/apply-rustfmt.yml
      - name: Commit formatted source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[apply-rustfmt] format remediation branch'
          git push origin HEAD:hardening/epistemic-honesty-runtime-boundary
