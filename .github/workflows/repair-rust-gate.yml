name: repair-rust-gate

on:
  push:
    branches: [hardening/epistemic-honesty-runtime-boundary]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-rust-gate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/epistemic-honesty-runtime-boundary
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply mechanical Rust gate repairs
        shell: python
        run: |
          from pathlib import Path

          oci = Path('crates/aros-sandbox/src/oci.rs')
          text = oci.read_text()
          text = text.replace(
              'if values.iter().any(|value| *value == ProbeOutcome::Failed) {',
              'if values.contains(&ProbeOutcome::Failed) {'
          )
          text = text.replace(
              '        return Err(SandboxError::FailClosed(\n            "campaign-bound OCI target spawn is not implemented".into(),\n        ));',
              '        Err(SandboxError::FailClosed(\n            "campaign-bound OCI target spawn is not implemented".into(),\n        ))'
          )
          oci.write_text(text)

          scope = Path('crates/aros-policy/src/path_scope.rs')
          text = scope.read_text().replace(
              'prop_assert!(normalize_path(&format!("{prefix}\\0{suffix}")).is_none());',
              'prop_assert!(normalize_path(&format!("{}\\0{}", prefix, suffix)).is_none());'
          )
          scope.write_text(text)

      - name: Validate full repository
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace
          python -m pip install pydantic httpx protobuf pytest ruff mypy
          python -m ruff check python
          python -m mypy python/aros_research
          PYTHONPATH=python python -m pytest python -q

      - name: Remove temporary diagnostics
        run: |
          rm -f .github/workflows/clippy-diagnostic.yml
          rm -f .github/workflows/repair-rust-gate.yml

      - name: Commit validated repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[repair-rust-gate] pass full Rust and Python gates'
          git push origin HEAD:hardening/epistemic-honesty-runtime-boundary
